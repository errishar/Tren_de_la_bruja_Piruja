<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laminación</title>

    <!--_H_ Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

    <!--_H_ Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Añadimos ?v=3 al final para obligar al navegador a descartar el script viejo -->
    <script src="js/rastreador.js?v=4:10"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            iniciarRastreo();
        });
    </script>

    <link rel="stylesheet" href="./css/estilo.css">
    
</head>
<body>
    <header style="max-width: 1600px; margin: 0 auto 20px auto;">
        <h1>Análisis de Perfil de Laminación</h1>
    </header>
    

    <Navigation style="max-width: 1600px; margin: 0 auto 20px auto;">
        <table>
            <td>
                <div id="membrete">
                    <script src="js/encabezado.js"></script>
                    <div id="membrete"></div>
                </div>
    
            </td>
            <td >
                <fieldset class="celda_palanquilla">
                    <legend class="titulo_Palanquilla_entrada">Palanquilla de entrada
                        
                    </legend>
                    <div>
                        <input type="radio" id="palanquilla_130" name="palanquilla" value="130">
                        <label for="palanquilla_130">palanquilla 130 mm</label>
                    </div>

                    <div>
                        <input type="radio" id="palanquilla_140" name="palanquilla" value="140">
                        <label for="palanquilla_140">palanquilla 140 mm</label>
                    </div>

                    <div>
                        <input type="radio" id="palanquilla_150" name="palanquilla" value="150" checked>
                        <label for="palanquilla_150">palanquilla 150 mm</label>
                    </div>

                    <div>
                        <input type="radio" id="palanquilla_160" name="palanquilla" value="160">
                        <label for="palanquilla_160">palanquilla 160 mm</label>
                    </div>
                </fieldset>
            </td>
            
        </table>
               
    </Navigation>

    <main>
        <!-- Contenedor dinámico requerido por tus scripts principales -->
        <div id="contenedor-tablas"></div>

        <!-- Carga del script principal como módulo -->
        <script type="module" src="./js/lamina_3.js"></script>
    
    </main>
    <footer id="pie">
        <script src="./js/pie_de_pagina.js"></script>
    </footer>

</body>
</html>
