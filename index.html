<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laminación</title>

    <!-- Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Rastreador -->
    <script src="js/rastreador.js?v=4:10"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            iniciarRastreo();
        });
    </script>

    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body>
    <header style="max-width: 1600px; margin: 0 auto 20px auto;">
        <h1>Análisis de Perfil de Laminación</h1>
    </header>

    <nav style="max-width: 1600px; margin: 0 auto 20px auto;">
        <table>
            <tr>
                <!-- Columna 1: Membrete -->
                <td>
                    <div id="membrete">
                        <script src="js/encabezado.js"></script>
                    </div>
                </td>

                <!-- Columna 2: Selección de Palanquilla -->
                <td>
                    <fieldset class="celda_palanquilla">
                        <legend class="titulo_Palanquilla_entrada">Palanquilla de entrada</legend>
                        <div>
                            <input type="radio" id="palanquilla_130" name="palanquilla" value="130">
                            <label class="palanquilla" for="palanquilla_130">palanquilla 130 mm</label>
                        </div>
                        <div>
                            <input type="radio" id="palanquilla_140" name="palanquilla" value="140">
                            <label class="palanquilla" for="palanquilla_140">palanquilla 140 mm</label>
                        </div>
                        <div>
                            <input type="radio" id="palanquilla_150" name="palanquilla" value="150" checked>
                            <label class="palanquilla" for="palanquilla_150">palanquilla 150 mm</label>
                        </div>
                        <div>
                            <input type="radio" id="palanquilla_160" name="palanquilla" value="160">
                            <label class="palanquilla" for="palanquilla_160">palanquilla 160 mm</label>
                        </div>
                    </fieldset>
                </td>

                <!-- Columna 3: Perfiles y Selectores Dinámicos -->
                <td>
                    <div class="caja_perfil">
                        <div>
                            <p class="avisos">Cacharrea con esto</p>
                            <label for="selectPerfil"><p class="label_combobox_perfil">Perfil:</p></label>
                            <select class="combobox_perfil" id="selectPerfil">
                                <option value="">-- Perfil --</option>
                            </select>
                        </div>

                        <!-- Zona dinámica donde aparecerán los selectores adicionales -->
                        <div id="zonaSelectsDinamicos" style="display: flex; gap: 15px; align-items: center;"></div>
                    </div>
                </td>
            </tr>
        </table>
    </nav>

    <main>
        <!-- Contenedor dinámico requerido por los scripts principales -->
        <div id="contenedor-tablas"></div>

        <!-- Carga del script principal como módulo -->
        <script type="module" src="./js/lamina_5.js"></script>
    </main>

    <footer id="pie">
        <script src="./js/pie_de_pagina.js"></script>
    </footer>
</body>
</html>
